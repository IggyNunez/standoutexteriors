name: Weekly Lighthouse

# ─────────────────────────────────────────────────────────────────────
# Runs every Monday at 6 AM US-Eastern (10:00 UTC during EDT, 11:00 UTC
# during EST — cron doesn't understand DST, so we split the difference
# and run at 10:30 UTC; close enough either way).
#
# Audits the 10 most important pages on the live Vercel production URL,
# posts the scores as a GitHub Actions job summary, and emails a digest
# to dev@ignacionunez.dev via Resend.
#
# If any score drops below its threshold, the job fails → GitHub emails
# me automatically about the failure, on top of the weekly digest.
#
# Thresholds live in .lighthouserc.json (JSON, so it can't hold comments —
# the reasoning goes here instead).
#
# Best Practices is capped at 0.75, NOT the 0.85 the other categories get.
# Every page scores exactly 78 and always will: the Google Ads tag sets
# third-party cookies (googleads.g.doubleclick.net, google.com/ccm/collect),
# which fails two audits worth 6 weight points. Confirmed by running
# Lighthouse directly against production. Those cookies are how conversion
# attribution works, so the only way to score 100 again is to delete the
# conversion tracking. Don't "fix" this by raising the threshold back — a
# permanently-failing check trains you to ignore the digest, which is how a
# real regression slips through. If Best Practices ever drops BELOW 75,
# something genuinely new has broken.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "30 10 * * 1" # Mondays at 10:30 UTC
  workflow_dispatch: # Lets me trigger a run on-demand from the Actions tab

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse against production
        id: lhci
        # `autorun` boots Chrome, runs the audit on every URL in the
        # config file, uploads the report to LHCI's temporary public
        # storage, and writes a summary to $GITHUB_STEP_SUMMARY.
        run: lhci autorun --config=./.lighthouserc.json
        # Don't fail the step immediately so the digest email still
        # fires on regressions — we'll fail the *job* at the end.
        continue-on-error: true

      - name: Send weekly digest email
        if: always() # run even if lhci step failed
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node .github/scripts/lighthouse-digest.mjs
