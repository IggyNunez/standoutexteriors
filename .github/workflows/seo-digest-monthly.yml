name: Monthly SEO Digest

on:
  schedule:
    - cron: "0 12 1 * *" # 1st of every month at 12:00 UTC (8 AM ET)
  workflow_dispatch:

jobs:
  digest:
    name: Build + send monthly SEO digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build and send digest
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SC_SITE_URL: "https://www.standoutexterior.com/"
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          # Optional: set this secret to CC Ridge on monthly reports.
          # Leave unset for internal-only reports.
          LEAD_INBOX_CC: ${{ secrets.LEAD_INBOX_CC }}
        run: node .github/scripts/phase2/seo-digest.mjs
