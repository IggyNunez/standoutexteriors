name: Weekly Keyword Tracker

on:
  schedule:
    - cron: "30 11 * * 1" # Mondays at 11:30 UTC
  workflow_dispatch:

# Need write permission because this workflow commits the updated
# keyword-history.json back to the repo.
permissions:
  contents: write

jobs:
  track:
    name: Track keyword rankings + commit history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GSC data + update history
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SC_SITE_URL: "https://www.standoutexterior.com/"
        run: node .github/scripts/phase2/keyword-tracker.mjs

      - name: Commit updated keyword-history.json
        run: |
          if git diff --quiet data/keyword-history.json; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/keyword-history.json
          git commit -m "chore: weekly keyword history snapshot"
          git push
